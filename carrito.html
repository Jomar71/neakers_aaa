<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tu carrito de compras — JOMAR AAA Sneakers Premium">
    <title>Carrito | JOMAR AAA Sneakers</title>
    <link rel="stylesheet" href="css/tienda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ─── CARRITO PAGE STYLES ─────────────────────────────────────── */
        .cart-page {
            min-height: calc(100svh - var(--header-height));
            padding: calc(var(--header-height) + 4rem) 0 6rem;
        }

        .cart-page-header {
            margin-bottom: 3rem;
        }

        .cart-page-header h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            margin-bottom: 0.5rem;
            line-height: 1;
        }

        .cart-page-header h1 span { color: var(--primary); }

        .cart-page-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 2rem;
            align-items: start;
        }

        /* ─── CART ITEMS LIST ─────────────────────────────────────────── */
        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item-card {
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 1.25rem;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            transition: var(--transition);
            animation: slideInCard 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideInCard {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .cart-item-card:hover {
            border-color: rgba(255, 215, 0, 0.15);
            transform: translateX(4px);
        }

        .cart-item-img-box {
            width: 90px;
            height: 90px;
            border-radius: 0.75rem;
            overflow: hidden;
            background: var(--surface-elevated);
            flex-shrink: 0;
        }

        .cart-item-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.4s ease;
        }

        .cart-item-card:hover .cart-item-img-box img {
            transform: scale(1.06);
        }

        .cart-item-details { min-width: 0; }

        .cart-item-brand {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--primary);
            margin-bottom: 0.2rem;
        }

        .cart-item-name {
            font-family: 'Epilogue', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-meta {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .cart-item-meta span {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.05em;
            background: var(--surface-elevated);
            padding: 0.2rem 0.6rem;
            border-radius: 2rem;
        }

        .cart-item-price-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .cart-item-price {
            font-family: 'Epilogue', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .btn-remove {
            background: none;
            border: 1px solid transparent;
            color: var(--text-subtle);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.6rem;
            border-radius: 0.5rem;
            transition: var(--transition-fast);
            font-family: 'Manrope', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-remove:hover {
            background: rgba(255, 68, 68, 0.08);
            border-color: rgba(255, 68, 68, 0.3);
            color: #ff4444;
        }

        /* ─── EMPTY CART ──────────────────────────────────────────────── */
        .empty-cart-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
        }

        .empty-cart-icon {
            font-size: 4rem;
            color: var(--primary);
            opacity: 0.2;
            display: block;
            margin-bottom: 1.5rem;
        }

        .empty-cart-box h2 {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .empty-cart-box p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .btn-go-shop {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--primary);
            color: #000;
            padding: 0.9rem 2rem;
            border-radius: var(--radius);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            transition: var(--transition);
            border: 2px solid var(--primary);
        }

        .btn-go-shop:hover {
            background: transparent;
            color: var(--primary);
            transform: translateY(-3px);
        }

        /* ─── ORDER SUMMARY ───────────────────────────────────────────── */
        .order-summary {
            position: sticky;
            top: calc(var(--header-height) + 1.5rem);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .summary-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .summary-row span:first-child { color: var(--text-muted); font-weight: 500; }
        .summary-row span:last-child  { font-weight: 700; }

        .summary-divider {
            height: 1px;
            background: var(--border);
            border: none;
            margin: 0;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-total-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .summary-total-price {
            font-family: 'Epilogue', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.04em;
        }

        .btn-checkout {
            background: var(--whatsapp-green);
            color: #fff;
            border: none;
            padding: 1.1rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            font-family: 'Manrope', sans-serif;
            width: 100%;
        }

        .btn-checkout:hover {
            background: var(--whatsapp-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
        }

        .btn-clear-all {
            background: transparent;
            color: var(--text-subtle);
            border: 1px solid var(--border);
            padding: 0.7rem 1rem;
            border-radius: var(--radius);
            font-family: 'Manrope', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-clear-all:hover {
            background: rgba(255, 68, 68, 0.08);
            border-color: rgba(255, 68, 68, 0.3);
            color: #ff4444;
        }

        .summary-note {
            font-size: 0.7rem;
            color: var(--text-subtle);
            text-align: center;
            line-height: 1.6;
        }

        /* ─── RESPONSIVE ──────────────────────────────────────────────── */
        @media (max-width: 900px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
            .order-summary {
                position: static;
            }
        }

        @media (max-width: 480px) {
            .cart-item-card {
                grid-template-columns: 70px 1fr;
            }
            .cart-item-price-box {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
    </style>
</head>

<body data-theme="dark">

    <!-- NAVIGATION -->
    <header>
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <img src="img/logos/LOGO SNEAKERS AAA.webp" alt="JOMAR AAA" class="logo-img">
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="hombres.html">Hombres</a></li>
                    <li><a href="mujeres.html">Mujeres</a></li>
                    <li>
                        <button id="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">
                            <i class="fas fa-circle-half-stroke"></i>
                        </button>
                    </li>
                </ul>
            </nav>
            <div class="mobile-menu-toggle">
                <button id="menu-toggle" aria-label="Menú"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main class="container cart-page">
        <div class="cart-page-header">
            <h1>Tu <span>Carrito</span></h1>
            <p id="cart-count-label">Cargando...</p>
        </div>

        <div class="cart-layout" id="cart-layout">
            <!-- Contenido dinámico -->
        </div>
    </main>

    <footer>
        <div class="container footer-inner">
            <div class="footer-brand">
                <img src="img/logos/LOGO SNEAKERS AAA.webp" alt="JOMAR AAA" class="footer-logo">
                <p>Sneakers Premium</p>
            </div>
            <p class="footer-copy">© 2025 JOMAR AAA. Todos los derechos reservados.</p>
        </div>
    </footer>

    <link rel="stylesheet" href="css/tienda.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const WHATSAPP_NUMBER = "573205032772";

        // ── TEMA ──────────────────────────────────────────────────────────
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);

        const themeBtn = document.getElementById('theme-toggle');
        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                const t = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.body.setAttribute('data-theme', t);
                localStorage.setItem('theme', t);
            });
        }

        // ── MENÚ MÓVIL ───────────────────────────────────────────────────
        const menuToggle = document.getElementById('menu-toggle');
        const navLinks   = document.querySelector('.nav-links');
        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = menuToggle.querySelector('i');
                if (icon) icon.className = navLinks.classList.contains('active') ? 'fas fa-times' : 'fas fa-bars';
            });
        }

        // ── CARRITO ───────────────────────────────────────────────────────
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const layout   = document.getElementById('cart-layout');
        const countLbl = document.getElementById('cart-count-label');

        const saveCart = () => localStorage.setItem('cart', JSON.stringify(cart));

        const formatPrice = (n) =>
            new Intl.NumberFormat('es-CO', {
                style: 'currency', currency: 'COP', minimumFractionDigits: 0
            }).format(n);

        const totalPrice = () => cart.reduce((s, i) => s + (i.precio || 0), 0);

        const removeItem = (index) => {
            cart.splice(index, 1);
            saveCart();
            render();
        };

        const clearCart = () => {
            if (!confirm('¿Vaciar el carrito?')) return;
            cart = [];
            saveCart();
            render();
        };

        const checkout = () => {
            if (cart.length === 0) return;
            const lines = cart.map((item, i) => {
                const talla = item.tallaEscogida ? `Talla: ${item.tallaEscogida}` : '';
                const precio = formatPrice(item.precio);
                return `${i + 1}. *${item.nombre}* (${item.referencia}) ${talla ? '— ' + talla : ''} — ${precio}`;
            }).join('\n');

            const total = formatPrice(totalPrice());
            const msg = `🛒 *Mi pedido — JOMAR AAA Sneakers* 🔥\n\n${lines}\n\n*TOTAL: ${total}*\n\n📦 Por favor confirmar disponibilidad y coordinar envío. ¡Gracias!`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        const render = () => {
            layout.innerHTML = '';

            if (cart.length === 0) {
                countLbl.textContent = 'Tu carrito está vacío';
                layout.innerHTML = `
                    <div class="empty-cart-box">
                        <i class="fas fa-shopping-cart empty-cart-icon"></i>
                        <h2>Carrito Vacío</h2>
                        <p>Aún no has añadido ningún par. ¡Explora nuestra colección!</p>
                        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
                            <a href="hombres.html" class="btn-go-shop">
                                <i class="fas fa-male"></i> Hombres
                            </a>
                            <a href="mujeres.html" class="btn-go-shop" style="background:transparent;color:var(--primary);">
                                <i class="fas fa-female"></i> Mujeres
                            </a>
                        </div>
                    </div>`;
                return;
            }

            countLbl.textContent = `${cart.length} par${cart.length > 1 ? 'es' : ''} seleccionado${cart.length > 1 ? 's' : ''}`;

            // ── Lista de items ──
            const itemsSection = document.createElement('div');
            itemsSection.className = 'cart-items-list';

            cart.forEach((item, i) => {
                const imgSrc = item.imagen ? item.imagen : 'img/logos/2NIKE.webp';
                const priceStr = formatPrice(item.precio || 0);
                const card = document.createElement('div');
                card.className = 'cart-item-card';
                card.style.animationDelay = `${i * 80}ms`;
                card.innerHTML = `
                    <div class="cart-item-img-box">
                        <img src="${imgSrc}" alt="${item.nombre}"
                             onerror="this.onerror=null;this.src='img/logos/2NIKE.webp';">
                    </div>
                    <div class="cart-item-details">
                        <p class="cart-item-brand">${item.marca || ''}</p>
                        <h3 class="cart-item-name">${item.nombre || 'Producto'}</h3>
                        <div class="cart-item-meta">
                            <span><i class="fas fa-barcode"></i> ${item.referencia || 'REF'}</span>
                            ${item.tallaEscogida ? `<span><i class="fas fa-ruler-horizontal"></i> Talla ${item.tallaEscogida}</span>` : ''}
                        </div>
                    </div>
                    <div class="cart-item-price-box">
                        <span class="cart-item-price">${priceStr}</span>
                        <button class="btn-remove" onclick="removeItemFromCart(${i})" title="Eliminar">
                            <i class="fas fa-trash-can"></i> Quitar
                        </button>
                    </div>
                `;
                itemsSection.appendChild(card);
            });

            layout.appendChild(itemsSection);

            // ── Resumen de pedido ──
            const summary = document.createElement('div');
            summary.className = 'order-summary';
            const subtotal = totalPrice();
            summary.innerHTML = `
                <p class="summary-title">Resumen del Pedido</p>
                <div class="summary-row">
                    <span>Artículos (${cart.length})</span>
                    <span>${formatPrice(subtotal)}</span>
                </div>
                <div class="summary-row">
                    <span>Envío</span>
                    <span style="color:var(--primary);">A coordinar</span>
                </div>
                <hr class="summary-divider">
                <div class="summary-total">
                    <span class="summary-total-label">Total</span>
                    <span class="summary-total-price">${formatPrice(subtotal)}</span>
                </div>
                <button class="btn-checkout" onclick="checkoutWhatsApp()">
                    <i class="fab fa-whatsapp"></i> Pedir por WhatsApp
                </button>
                <button class="btn-clear-all" onclick="clearAllCart()">
                    <i class="fas fa-trash"></i> Vaciar carrito
                </button>
                <p class="summary-note">
                    <i class="fas fa-info-circle"></i>
                    El pago y el envío se coordinan directamente por WhatsApp con el vendedor.
                </p>
            `;

            layout.appendChild(summary);
        };

        // Exponer funciones globales para los onclick inline
        window.removeItemFromCart = removeItem;
        window.clearAllCart = clearCart;
        window.checkoutWhatsApp = checkout;

        render();
    });
    </script>
</body>

</html>
