            opacity: 0;

        }

<body data-gender="hombre" data-theme="dark">
    <header>
        <div class="container nav-content">
            <a href="index.html" class="logo">

            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
